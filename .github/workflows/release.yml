# Builds, attests and releases the binaries for a `v*` tag, then publishes boundrail-cli to npm
# when the NPM_TOKEN secret is set.
#
# After a failure, use "Re-run failed jobs", not "Re-run all jobs": once the release job has
# succeeded the release exists, and a full re-run fails at `gh release create` (or, earlier,
# rebuilds archives whose checksums differ from the published SHA256SUMS). To redo a release,
# delete the release and its tag first.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml and npm/package.json
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          npm=$(node -p 'require("./npm/package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$cargo" ] || [ "$npm" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $cargo, npm/package.json $npm: they must agree"
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The toolchain rust-toolchain.toml pins, plus the target.
      - shell: bash
        run: rustup toolchain install && rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - shell: bash
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          stem=boundrail-$GITHUB_REF_NAME-$TARGET
          mkdir -p "dist/$stem"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/$stem/"
          cp -R skills "dist/$stem/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "../target/$TARGET/release/boundrail.exe" "$stem/"
            7z a -tzip "$stem.zip" "$stem"
          else
            cp "../target/$TARGET/release/boundrail" "$stem/"
            tar -czf "$stem.tar.gz" "$stem"
          fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/boundrail-*

  release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum boundrail-* > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Whether the secret is set, not its value: the token itself reaches only the publish step.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN is not set; boundrail-cli is not published"
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Ship the release's SHA256SUMS and licenses in the package
        if: env.HAS_NPM_TOKEN == 'true'
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir npm
          cp LICENSE-MIT LICENSE-APACHE npm/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: env.HAS_NPM_TOKEN == 'true'
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
