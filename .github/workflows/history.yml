name: architecture history

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 1 * *'

permissions:
  contents: read

concurrency:
  group: architecture-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup component add rust-analyzer rust-src
      - run: cargo fetch --locked
      - run: cargo build --release --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .boundrail/history
          key: architecture-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: architecture-history-${{ runner.os }}-
      - name: Append monthly architecture snapshots
        run: target/release/boundrail history . --sample monthly --limit 24 --append --language rust --rust-features default --hotspots
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: .boundrail/history
          key: architecture-history-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: architecture-history
          path: |
            .boundrail/history.json
            .boundrail/history.html
          if-no-files-found: warn
