[package]
name = "archgraph"
version = "0.1.0"
edition = "2024"
description = "Import-graph evidence for architecture decisions: module metrics, cycles, rule verdicts and simulated moves"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/archgraph"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
sha2 = "0.11.1"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
