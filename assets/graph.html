<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archgraph</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1d2025; --muted: #5f6670; --line: #d7dbe0; --panel: #f4f5f7;
  --edge: #8b929c; --bad: #c62828; --focus: #1f5fcc;
  --green: #2e7d32; --amber: #b86e00; --red: #c62828; --grey: #9aa0a8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --fg: #e6e8eb; --muted: #9ea5af; --line: #30343b; --panel: #1c1f24;
    --edge: #737b86; --bad: #ef5350; --focus: #7aa7ff;
    --green: #4caf50; --amber: #f0a020; --red: #ef5350; --grey: #6d737c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 8px; overflow-wrap: anywhere; }
h3 { font-size: 13px; margin: 14px 0 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.swatch.line { width: 16px; height: 3px; border-radius: 0; background: var(--bad); }
main { flex: 1; min-height: 0; display: flex; }
#canvas { flex: 1; min-width: 0; }
svg { width: 100%; height: 100%; display: block; }
aside { width: 360px; flex: none; overflow-y: auto; padding: 12px 16px;
  border-left: 1px solid var(--line); background: var(--panel); }
@media (max-width: 720px) {
  body { height: auto; }
  main { flex-direction: column; }
  #canvas { height: 90vw; min-height: 300px; flex: none; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
table { border-collapse: collapse; font-size: 13px; }
td { padding: 1px 12px 1px 0; }
ul { margin: 4px 0 0; padding-left: 18px; }
li { margin: 2px 0; overflow-wrap: anywhere; font-size: 13px; }
.forbidden { color: var(--bad); font-weight: 600; }
.edge { fill: none; stroke: var(--edge); opacity: .75; }
.edge.bad { stroke: var(--bad); opacity: .95; }
#arrow path { fill: var(--edge); }
#arrow-bad path { fill: var(--bad); }
.node { cursor: pointer; }
.node circle { stroke: var(--bg); stroke-width: 2; }
.node text { fill: var(--fg); font-size: 12px; text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.node:focus { outline: none; }
.node:focus-visible circle { stroke: var(--focus); stroke-width: 3; }
.green { fill: var(--green); background: var(--green); }
.amber { fill: var(--amber); background: var(--amber); }
.red { fill: var(--red); background: var(--red); }
.grey { fill: var(--grey); background: var(--grey); }
svg.selecting .node, svg.selecting .edge { opacity: .18; }
svg.selecting .node.on, svg.selecting .edge.on { opacity: 1; }
.node.selected circle { stroke: var(--fg); stroke-width: 3; }
.node.importer circle { stroke: var(--focus); stroke-width: 3; }
</style>
</head>
<body>
<header>
  <h1 id="title">archgraph</h1>
  <div class="muted" id="stats"></div>
  <div class="muted legend">
    <span><i class="swatch green"></i>cohesive, few links</span>
    <span><i class="swatch amber"></i>mixed</span>
    <span><i class="swatch red"></i>low cohesion, many links</span>
    <span><i class="swatch grey"></i>fewer than 2 files</span>
    <span><i class="swatch line"></i>has a forbidden import</span>
  </div>
</header>
<main>
  <div id="canvas">
    <svg id="svg" role="group" aria-label="Module import graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="arrow-bad" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script type="application/json" id="graph">{{GRAPH}}</script>
<script>
"use strict";
const doc = JSON.parse(document.getElementById("graph").textContent);
const svg = document.getElementById("svg");
const NS = svg.namespaceURI;
const panel = document.getElementById("panel");

function el(tag, attrs, text) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmt(x) { return x === null ? "n/a" : String(x); }

const mods = doc.modules;
const moduleOf = new Map(doc.files.map(f => [f.path, f.module]));
const degree = m => m.ca + m.ce;
const sorted = mods.map(degree).sort((a, b) => a - b);
const n = sorted.length;
const median = n === 0 ? 0 : n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
function health(m) {
  if (m.files < 2) return "grey";
  if (m.cohesion !== null && m.cohesion >= 0.5 && degree(m) <= median) return "green";
  if (m.cohesion !== null && m.cohesion < 0.3 && degree(m) > median) return "red";
  return "amber";
}
const forbidden = doc.edges.filter(e => e.verdict === "forbidden").length;
/* "1 cycle", "2 cycles": the count with its noun in the matching number. */
const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const commit = doc.source.git ? " at " + doc.source.git.commit.slice(0, 12) + (doc.source.git.dirty ? " (dirty)" : "") : "";
document.getElementById("stats").textContent =
  `${count(doc.files.length, "file", "files")}, ${count(mods.length, "module", "modules")}, ` +
  `${count(doc.module_edges.length, "module import", "module imports")}, ` +
  `${count(doc.cycles.length, "cycle", "cycles")}, ${count(forbidden, "forbidden import", "forbidden imports")}, ` +
  `${count(doc.findings.length, "finding", "findings")}. ` +
  `${doc.source.language} via ${doc.source.collector.name}${commit}; ` +
  (doc.config.rules ? `rules ${doc.config.rules.path}.` : "no rules.");

/* Deterministic Fruchterman-Reingold layout: start on a circle, fixed iteration count. */
const index = new Map(mods.map((m, i) => [m.id, i]));
const radius = mods.map(m => 6 + 5 * Math.sqrt(m.files));
const links = doc.module_edges.map(e => [index.get(e.from), index.get(e.to)]);
const pos = mods.map((_, i) => {
  const a = 2 * Math.PI * i / Math.max(n, 1);
  return { x: 40 * Math.sqrt(n) * Math.cos(a), y: 40 * Math.sqrt(n) * Math.sin(a) };
});
const K = 90, ITERATIONS = 300;
for (let it = 0; it < ITERATIONS; it++) {
  const step = K * (1 - it / ITERATIONS) * 0.5 + 0.5;
  const d = pos.map(() => ({ x: 0, y: 0 }));
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
      const len = Math.hypot(dx, dy) || 0.01;
      const gap = Math.max(len - radius[i] - radius[j], 1);
      const f = K * K / gap;
      d[i].x += dx / len * f; d[i].y += dy / len * f;
      d[j].x -= dx / len * f; d[j].y -= dy / len * f;
    }
  }
  for (const [a, b] of links) {
    const dx = pos[a].x - pos[b].x, dy = pos[a].y - pos[b].y;
    const len = Math.hypot(dx, dy) || 0.01;
    const f = len * len / K;
    d[a].x -= dx / len * f; d[a].y -= dy / len * f;
    d[b].x += dx / len * f; d[b].y += dy / len * f;
  }
  for (let i = 0; i < n; i++) {
    d[i].x -= pos[i].x * 0.5; d[i].y -= pos[i].y * 0.5;
    const len = Math.hypot(d[i].x, d[i].y);
    if (len > 0) {
      pos[i].x += d[i].x / len * Math.min(len, step);
      pos[i].y += d[i].y / len * Math.min(len, step);
    }
  }
}
let minX = 0, minY = 0, maxX = 1, maxY = 1;
if (n > 0) {
  minX = Math.min(...pos.map((p, i) => p.x - radius[i])) - 60;
  maxX = Math.max(...pos.map((p, i) => p.x + radius[i])) + 60;
  minY = Math.min(...pos.map((p, i) => p.y - radius[i])) - 20;
  maxY = Math.max(...pos.map((p, i) => p.y + radius[i])) + 30;
}
svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);

const edgeEls = [];
doc.module_edges.forEach((e, k) => {
  const [a, b] = links[k];
  const p = pos[a], q = pos[b];
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 0.01;
  /* Bend every edge to its right, so a -> b and b -> a stay apart. */
  const cx = (p.x + q.x) / 2 - dy / len * len * 0.15, cy = (p.y + q.y) / 2 + dx / len * len * 0.15;
  const toward = (from, to, r) => {
    const ux = to.x - from.x, uy = to.y - from.y, ul = Math.hypot(ux, uy) || 0.01;
    return { x: from.x + ux / ul * r, y: from.y + uy / ul * r };
  };
  const s = toward(p, { x: cx, y: cy }, radius[a]);
  const t = toward(q, { x: cx, y: cy }, radius[b] + 2);
  const bad = e.forbidden > 0;
  const path = el("svg:path", {
    d: `M${s.x},${s.y} Q${cx},${cy} ${t.x},${t.y}`,
    class: bad ? "edge bad" : "edge",
    "stroke-width": String(1 + Math.sqrt(e.imports)),
    "marker-end": bad ? "url(#arrow-bad)" : "url(#arrow)",
  });
  path.appendChild(el("svg:title", {}, `${e.from} -> ${e.to}: ${e.imports} imports, ${e.forbidden} forbidden`));
  document.getElementById("edges").appendChild(path);
  edgeEls.push(path);
});

const nodeEls = mods.map((m, i) => {
  const g = el("svg:g", {
    class: "node", tabindex: "0", role: "button",
    "aria-label": `module ${m.id}, ${m.files} files, ${health(m)}`,
    transform: `translate(${pos[i].x},${pos[i].y})`,
  });
  g.appendChild(el("svg:circle", { r: String(radius[i]), class: health(m) }));
  g.appendChild(el("svg:text", { y: String(radius[i] + 14) }, m.id));
  g.addEventListener("click", ev => { ev.stopPropagation(); select(i); });
  g.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(i); }
  });
  document.getElementById("nodes").appendChild(g);
  return g;
});
svg.addEventListener("click", () => select(null));
document.addEventListener("keydown", ev => { if (ev.key === "Escape") select(null); });

function select(i) {
  svg.classList.toggle("selecting", i !== null);
  nodeEls.forEach(g => g.classList.remove("on", "selected", "importer"));
  edgeEls.forEach(p => p.classList.remove("on"));
  panel.replaceChildren();
  if (i === null) {
    panel.appendChild(el("p", { class: "muted" },
      "Select a module to list the modules that import it and their file imports."));
    return;
  }
  const m = mods[i];
  nodeEls[i].classList.add("on", "selected");
  doc.module_edges.forEach((e, k) => {
    if (e.to !== m.id) return;
    edgeEls[k].classList.add("on");
    nodeEls[index.get(e.from)].classList.add("on", "importer");
  });

  panel.appendChild(el("h2", {}, m.id));
  const table = el("table");
  for (const [k, v] of [["health", health(m)], ["files", m.files], ["Ca (importing modules)", m.ca],
    ["Ce (imported modules)", m.ce], ["instability", fmt(m.instability)], ["cohesion", fmt(m.cohesion)]]) {
    const tr = el("tr");
    tr.appendChild(el("td", { class: "muted" }, k));
    tr.appendChild(el("td", {}, String(v)));
    table.appendChild(tr);
  }
  panel.appendChild(table);

  const importers = doc.module_edges.filter(e => e.to === m.id).sort((a, b) => b.imports - a.imports);
  panel.appendChild(el("h3", {}, importers.length ? `Imported by ${count(importers.length, "module", "modules")}` : "Imported by no module"));
  for (const me of importers) {
    panel.appendChild(el("h3", {}, `${me.from}: ${count(me.imports, "import", "imports")}` + (me.forbidden ? `, ${me.forbidden} forbidden` : "")));
    const ul = el("ul");
    for (const e of doc.edges) {
      if (moduleOf.get(e.from) !== me.from || moduleOf.get(e.to) !== m.id) continue;
      const li = el("li", {}, `${e.from} -> ${e.to} (${e.kind})`);
      if (e.verdict) {
        li.appendChild(el("span", { class: e.verdict === "forbidden" ? "forbidden" : "muted" },
          ` ${e.verdict}` + (e.rule ? ` by ${e.rule}` : "")));
      }
      ul.appendChild(li);
    }
    panel.appendChild(ul);
  }
}
select(null);
</script>
</body>
</html>
