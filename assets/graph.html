<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archgraph</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f6; --surface: #ffffff; --raise: #f7f8fa; --fg: #14171c; --muted: #5d6672; --line: #dde1e7; --grid: #cfd5dd;
  --edge: #8a93a1; --forbidden: #d92d20; --unplanned: #b86e00; --in: #0a6fc2; --out: #b0169a;
  --move: #0a8c7c; --cochange: #6a4bdc; --focus: #0a6fc2;
  --green: #2f9257; --amber: #c39210; --red: #cf4e3d; --grey: #99a1ac;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0e13; --surface: #11151b; --raise: #171c23; --fg: #e3e7ed; --muted: #8b94a1; --line: #232932; --grid: #1d232c;
    --edge: #6c7685; --forbidden: #f04438; --unplanned: #f5a524; --in: #3d9dff; --out: #e45bcb;
    --move: #2ed3b7; --cochange: #9b8afb; --focus: #3d9dff;
    --green: #46b56f; --amber: #dcb137; --red: #e8705a; --grey: #5f6875;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 13px/1.45 var(--sans); }
button, input, summary { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; display: grid; gap: 8px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
h1 { font: 700 15px/1.2 var(--mono); margin: 0; letter-spacing: -.01em; }
h1::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 2px;
  background: var(--fg); transform: rotate(45deg) translateY(-1px); }
.muted { color: var(--muted); }
#stats { min-width: 0; overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.toolbar form { flex: 0 1 300px; min-width: 0; display: flex; }
#search { width: 100%; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--raise); font: 12.5px var(--mono); }
#search[aria-invalid="true"] { border-color: var(--forbidden); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--raise); cursor: pointer; user-select: none; white-space: nowrap; }
.chip input { margin: 0; accent-color: var(--fg); }
.chip:has(input:checked) { border-color: var(--fg); }
#hide { position: relative; }
#hide summary { list-style: none; }
#hide summary::-webkit-details-marker { display: none; }
#hide summary::after { content: "\25BE"; margin-left: 2px; color: var(--muted); }
#hide-list { position: absolute; z-index: 5; top: 36px; left: 0; width: min(320px, calc(100vw - 32px)); max-height: 300px; overflow: auto;
  padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
#hide-list label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font: 12px var(--mono); }
#hide-list label:hover { background: var(--raise); }
#hide-list .n { margin-left: auto; color: var(--muted); }
#legend-box { position: relative; }
#legend-box > summary { position: absolute; right: 0; top: 0; cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
#legend-box > summary::after { content: " \25B4"; }
#legend-box:not([open]) > summary { position: static; }
#legend-box:not([open]) > summary::after { content: " \25BE"; }
.legend { padding-right: 70px; display: flex; flex-wrap: wrap; gap: 3px 14px; color: var(--muted); font-size: 12px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend b { font-weight: 600; color: var(--fg); }
.sw { display: inline-block; flex: none; }
.sw.h { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid currentColor;
  background: color-mix(in srgb, currentColor 24%, transparent); }
.green { color: var(--green); } .amber { color: var(--amber); } .red { color: var(--red); } .grey { color: var(--grey); }
.sw.ln { width: 18px; border-top: 2px solid var(--edge); }
.sw.ln.forbidden { border-color: var(--forbidden); } .sw.ln.unplanned { border-color: var(--unplanned); }
.sw.ln.dash { border-top-style: dashed; } .sw.ln.in { border-color: var(--in); } .sw.ln.out { border-color: var(--out); }
.sw.ln.move { border-top: 2px dashed var(--move); } .sw.ln.co { border-top: 2px dotted var(--cochange); }
.sw.ring { width: 8px; height: 8px; border: 1.5px solid var(--edge); border-radius: 50%; }
.sw.dia { width: 8px; height: 8px; background: var(--muted); transform: rotate(45deg); }
main { flex: 1; min-height: 0; display: flex; }
#stage { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#canvas.dragging { cursor: grabbing; } #canvas.pointing { cursor: pointer; }
#canvas:focus-visible { outline-offset: -3px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; border: 1px solid var(--line);
  border-radius: 9px; overflow: hidden; background: var(--surface); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.zoom button { width: 34px; height: 32px; border: 0; background: none; cursor: pointer; font: 600 15px var(--mono); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--raise); }
#level { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); color: var(--muted); font: 11.5px var(--mono); pointer-events: none; max-width: calc(100% - 80px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tip { position: absolute; z-index: 4; max-width: min(420px, calc(100% - 24px)); padding: 8px 10px; pointer-events: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  font-size: 12px; }
#tip .t { font: 600 12px var(--mono); overflow-wrap: anywhere; margin-bottom: 3px; }
#tip div + div { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
aside { width: clamp(280px, 30vw, 380px); flex: none; overflow-y: auto; padding: 14px 16px 24px; border-left: 1px solid var(--line); background: var(--surface); }
aside h2 { font: 600 14px/1.35 var(--mono); margin: 2px 0 10px; overflow-wrap: anywhere; }
aside h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.kicker { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 11px; letter-spacing: 0; text-transform: none; font-weight: 500; }
.back { border: 0; background: none; padding: 0; margin: 0 0 10px; color: var(--muted); cursor: pointer; font-size: 12px; }
.back:hover { color: var(--fg); }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 0; }
.metrics div { padding: 6px 8px; background: var(--raise); border-radius: 7px; border: 1px solid var(--line); }
.metrics dt { font-size: 10.5px; color: var(--muted); }
.metrics dd { margin: 0; font: 600 14px var(--mono); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.act { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raise); cursor: pointer; font-size: 12px; }
.act:hover { border-color: var(--fg); }
.link { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px; }
.link:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
details.row { border-bottom: 1px solid var(--line); }
details.row > summary { display: grid; grid-template-columns: 12px minmax(0, 1fr) 64px 36px; align-items: center; gap: 8px;
  padding: 6px 2px; cursor: pointer; list-style: none; }
details.row > summary::-webkit-details-marker { display: none; }
details.row > summary:hover { background: var(--raise); }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font: 12px var(--mono); text-align: right; }
.bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--edge); }
.bar i.forbidden { background: var(--forbidden); } .bar i.unplanned { background: var(--unplanned); }
.tags { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
.v { font-size: 11px; color: var(--muted); }
.v.forbidden, .tags .forbidden { color: var(--forbidden); font-weight: 600; }
.v.unplanned, .tags .unplanned { color: var(--unplanned); font-weight: 600; }
.inner { padding: 4px 0 10px 20px; }
ul.edges { list-style: none; margin: 6px 0 0; padding: 0; }
ul.edges li { padding: 3px 0; font-size: 12px; overflow-wrap: anywhere; }
ul.edges li .meta { color: var(--muted); font-size: 11px; }
details.kind { border: 1px solid var(--line); border-radius: 9px; margin: 0 0 8px; background: var(--raise); }
details.kind > summary { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; font: 600 12.5px var(--mono); }
details.kind > p { margin: 0 10px 6px; font-size: 12px; }
.badge { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--fg); color: var(--surface);
  font: 600 11px/18px var(--mono); text-align: center; }
ul.flist { list-style: none; margin: 0; padding: 0 4px 6px; }
ul.flist button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 6px;
  cursor: pointer; font: 11.5px/1.35 var(--mono); }
.clamp { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
ul.flist button:hover { background: var(--surface); }
table.sim { border-collapse: collapse; width: 100%; font: 12px var(--mono); margin-top: 6px; }
table.sim th, table.sim td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.sim th:first-child, table.sim td:first-child { text-align: left; }
table.sim th { font: 600 10.5px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
table.sim tr.mod td { font-weight: 600; padding-top: 8px; color: var(--fg); }
.better { color: var(--green); font-weight: 600; } .worse { color: var(--forbidden); font-weight: 600; }
.note { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--move); background: var(--raise); border-radius: 0 7px 7px 0; overflow-wrap: anywhere; }
p { margin: 6px 0; }
@media (max-width: 720px) {
  html, body { height: auto; }
  header { padding: 10px 16px 8px; }
  .toolbar form { flex: 1 1 100%; }
  main { flex-direction: column; }
  #stage { flex: none; height: min(76vh, 620px); min-height: 340px; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">archgraph</h1>
    <div class="muted" id="stats"></div>
  </div>
  <div class="toolbar">
    <form id="find" role="search">
      <input id="search" type="search" list="paths" autocomplete="off" spellcheck="false"
        placeholder="Find a module or file  ( / )" aria-label="Find a module or file">
      <datalist id="paths"></datalist>
    </form>
    <label class="chip"><input type="checkbox" id="t-problems">forbidden and unplanned only</label>
    <label class="chip"><input type="checkbox" id="t-cycles">cycles only</label>
    <label class="chip"><input type="checkbox" id="t-types">hide type-only</label>
    <details id="hide"><summary class="chip" id="hide-sum">hide modules</summary><div id="hide-list"></div></details>
  </div>
  <details id="legend-box" open><summary>Legend</summary>
  <div class="legend">
    <span><b>Modules</b></span>
    <span><i class="sw h green"></i>cohesive, few links</span>
    <span><i class="sw h amber"></i>mixed</span>
    <span><i class="sw h red"></i>low cohesion, many links</span>
    <span><i class="sw h grey"></i>fewer than 2 files</span>
    <span><i class="sw dia"></i>barrel file</span>
    <span><b>Imports</b></span>
    <span><i class="sw ln"></i>allowed or no rules</span>
    <span><i class="sw ln forbidden"></i>forbidden</span>
    <span><i class="sw ln unplanned"></i>unplanned</span>
    <span><i class="sw ln dash"></i>type-only</span>
    <span><i class="sw ring"></i>in a cycle</span>
    <span><i class="sw ln in"></i>importers</span>
    <span><i class="sw ln out"></i>imports</span>
    <span><i class="sw ln move"></i>suggested move</span>
    <span><i class="sw ln co"></i>changed together</span>
    <span>Colors are a reading aid, not a score.</span>
  </div>
  </details>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" tabindex="0" role="img"
      aria-label="Module import graph. Arrow keys pan, plus and minus zoom, 0 fits. Tab to reach each module."></canvas>
    <div id="mods" class="sr" role="list" aria-label="Modules"></div>
    <div id="level"></div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="z-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" id="z-out" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
      <button type="button" id="z-fit" aria-label="Fit to view" title="Fit to view (0)">&#x2922;</button>
    </div>
    <div id="tip" role="tooltip" hidden></div>
  </div>
  <aside id="panel" aria-label="Details"></aside>
  <div id="announce" class="sr" aria-live="polite"></div>
</main>
<script type="application/json" id="graph">{{GRAPH}}</script>
<script>
"use strict";
const doc = JSON.parse(document.getElementById("graph").textContent);
const $ = id => document.getElementById(id);

/* Every piece of document text reaches the page through textContent, never markup. */
function el(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const fmt = x => x === null || x === undefined ? "n/a" : String(x);
/* "1 cycle", "2 cycles": the count with its noun in the matching number. */
const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const dirname = p => p.slice(0, Math.max(p.lastIndexOf("/"), 0));
const basename = p => p.slice(p.lastIndexOf("/") + 1);
const TAU = Math.PI * 2;

/* ---------- header ---------- */
const mods = doc.modules, N = mods.length;
const forbidden = doc.edges.filter(e => e.verdict === "forbidden").length;
const commit = doc.source.git ? " at " + doc.source.git.commit.slice(0, 12) + (doc.source.git.dirty ? " (dirty)" : "") : "";
$("stats").textContent =
  `${count(doc.files.length, "file", "files")}, ${count(mods.length, "module", "modules")}, ` +
  `${count(doc.module_edges.length, "module import", "module imports")}, ` +
  `${count(doc.cycles.length, "cycle", "cycles")}, ${count(forbidden, "forbidden import", "forbidden imports")}, ` +
  `${count(doc.findings.length, "finding", "findings")}. ` +
  `${doc.source.language} via ${doc.source.collector.name}${commit}; ` +
  (doc.config.rules ? `rules ${doc.config.rules.path}.` : "no rules.");

/* ---------- model ---------- */
const modIndex = new Map(mods.map((m, i) => [m.id, i]));
const files = doc.files.map((f, i) => ({ i, path: f.path, name: basename(f.path), mod: modIndex.get(f.module),
  barrel: f.barrel, x: 0, y: 0, ins: [], outs: [] }));
const F = files.length;
const fileIndex = new Map(files.map(f => [f.path, f.i]));
const modFiles = mods.map(() => []);
for (const f of files) modFiles[f.mod].push(f.i);

/* The directory every file shares, left out of the paths the panel prints. */
const PREFIX = (() => {
  if (!F) return "";
  let p = dirname(files[0].path).split("/");
  for (const f of files) {
    const q = dirname(f.path).split("/");
    let j = 0;
    while (j < p.length && j < q.length && p[j] === q[j]) j++;
    p = p.slice(0, j);
  }
  return p.length && p[0] !== "" ? p.join("/") + "/" : "";
})();
/* A first folder every module id shares ("src/"), left off the labels on the canvas. */
const MOD_PREFIX = (() => {
  const first = N > 1 && mods[0].id.includes("/") ? mods[0].id.slice(0, mods[0].id.indexOf("/") + 1) : "";
  return first && mods.every(m => m.id.startsWith(first) && m.id.length > first.length) ? first : "";
})();
const short = p => PREFIX && p.startsWith(PREFIX) ? p.slice(PREFIX.length) : p;
const shortText = s => PREFIX ? s.split(PREFIX).join("") : s;

const medges = doc.module_edges.map((e, i) => ({ i, a: modIndex.get(e.from), b: modIndex.get(e.to), imports: e.imports,
  forbidden: e.forbidden, v: { allowed: 0, forbidden: 0, unplanned: 0, none: 0 }, types: 0, list: [] }));
const meOf = new Map(medges.map(e => [e.a * N + e.b, e]));
const edges = doc.edges.map((e, i) => {
  const a = fileIndex.get(e.from), b = fileIndex.get(e.to);
  const ma = files[a].mod, mb = files[b].mod;
  const r = { i, a, b, kind: e.kind, verdict: e.verdict, rule: e.rule,
    tone: e.verdict === "forbidden" || e.verdict === "unplanned" ? e.verdict : "neutral",
    me: ma === mb ? null : meOf.get(ma * N + mb) || null };
  files[a].outs.push(i);
  files[b].ins.push(i);
  if (r.me) {
    r.me.list.push(i);
    r.me.v[e.verdict || "none"]++;
    if (e.kind === "type") r.me.types++;
  }
  return r;
});
for (const me of medges) {
  me.typeOnly = me.list.length > 0 && me.types === me.list.length;
  me.tone = me.forbidden || me.v.forbidden ? "forbidden" : me.v.unplanned ? "unplanned" : "neutral";
  me.twoWay = meOf.has(me.b * N + me.a);
  me.w = Math.min(9, Math.round((0.8 + 0.95 * Math.log2(Math.max(1, me.imports))) * 4) / 4);
}

const modCycle = new Int32Array(N).fill(-1), fileCycle = new Int32Array(F).fill(-1);
const breaks = new Set();
doc.cycles.forEach((c, k) => {
  for (const m of c.members) {
    const i = c.level === "module" ? modIndex.get(m) : fileIndex.get(m);
    if (i !== undefined) (c.level === "module" ? modCycle : fileCycle)[i] = k;
  }
  for (const l of c.break) breaks.add(l.from + "\n" + l.to);
});
for (const me of medges) me.cycle = modCycle[me.a] >= 0 && modCycle[me.a] === modCycle[me.b];
for (const e of edges) {
  e.fileCycle = !e.me && fileCycle[e.a] >= 0 && fileCycle[e.a] === fileCycle[e.b];
  e.cycle = e.me ? e.me.cycle : e.fileCycle;
}

const degree = m => m.ca + m.ce;
const sortedDeg = mods.map(degree).sort((a, b) => a - b);
const median = N === 0 ? 0 : N % 2 ? sortedDeg[(N - 1) / 2] : (sortedDeg[N / 2 - 1] + sortedDeg[N / 2]) / 2;
function health(m) {
  if (m.files < 2) return "grey";
  if (m.cohesion !== null && m.cohesion >= 0.5 && degree(m) <= median) return "green";
  if (m.cohesion !== null && m.cohesion < 0.3 && degree(m) > median) return "red";
  return "amber";
}
const modHealth = mods.map(health);
const HEALTH_TEXT = { green: "cohesive, few links", amber: "mixed", red: "low cohesion, many links", grey: "fewer than 2 files" };

/* ---------- layout (deterministic: no randomness, fixed iteration counts) ---------- */
const R_DOT = 2.6, SP = 10, GAP = 34, GOLDEN = Math.PI * (3 - Math.sqrt(5));
const K_FILE0 = 1.25, K_FILE1 = 2.0, K_LABEL = 3.2, K_MAX = 16;

function sunflower(n, c) {
  const p = [];
  for (let k = 0; k < n; k++) {
    const r = c * Math.sqrt(k + 0.5), a = k * GOLDEN;
    p.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
  }
  return p;
}

/* Circles of radius R pulled together by weighted links, pushed apart until none overlap.
   ponytail: O(n^2) per step, fine to about a thousand circles; a quadtree lifts that. */
function pack(R, links, gap, iter, spread, pull) {
  const n = R.length, X = new Float64Array(n), Y = new Float64Array(n);
  if (!n) return [X, Y];
  const deg = new Float64Array(n);
  for (const [p, q, w] of links) { deg[p] += w; deg[q] += w; }
  const order = [...R.keys()].sort((a, b) => deg[b] - deg[a] || R[b] - R[a] || a - b);
  const meanR = R.reduce((s, r) => s + r, 0) / n;
  sunflower(n, meanR * 1.5 + gap).forEach((p, j) => { X[order[j]] = p.x; Y[order[j]] = p.y; });
  const maxW = Math.max(1, ...links.map(l => l[2]));
  const mass = Float64Array.from(R, r => r * r + 1);

  if (e.cycle) panel.append(el("p", { class: "muted" }, "Part of an import cycle" + (breaks.has(files[e.a].path + "\n" + files[e.b].path) ? "; removing it is part of the suggested break." : ".")));
}
function simTable(after) {
  const before = doc.summary;
  const t = el("table", { class: "sim" });
  const hr = el("tr");
  for (const h of ["", "before", "after"]) hr.append(el("th", {}, h));
  t.append(hr);
  const row = (name, a, b, better) => {
    const tr = el("tr");
    const cls = a === b || a === null || b === null || better === 0 ? "" : (b > a) === (better > 0) ? "better" : "worse";
    tr.append(el("td", {}, name), el("td", {}, fmt(a)), el("td", cls ? { class: cls } : {}, fmt(b)));
    t.append(tr);
  };
  row("forbidden", before.forbidden, after.forbidden, -1);
  row("unplanned", before.unplanned, after.unplanned, -1);
  row("cycles", before.cycles, after.cycles, -1);
  for (const [m, a] of Object.entries(after.modules)) {
    const b = before.modules[m];
    const tr = el("tr", { class: "mod" });
    const td = el("td", { colspan: "3" }, m + (a === null ? ": emptied by the move" : b ? "" : ": new module"));
    tr.append(td);
    t.append(tr);
    if (a === null) continue;
    row("cohesion", b ? b.cohesion : null, a.cohesion, 1);
    row("Ca", b ? b.ca : null, a.ca, 0);
    row("Ce", b ? b.ce : null, a.ce, 0);
    row("instability", b ? b.instability : null, a.instability, 0);
  }
  return t;
}
function findingPanel(j) {
  const fd = findings[j], f = fd.f, ev = f.evidence || {};
  head(f.kind, subjectText(f));
  if (KIND_TEXT[f.kind]) panel.append(el("p", { class: "muted" }, KIND_TEXT[f.kind]));
  const line = t => panel.append(el("p", {}, t));
  const acts = el("div", { class: "actions" });
  acts.append(btn("Zoom to it", "act", () => zoomToFinding(fd)));
  panel.append(acts);
  if (f.kind === "cycle") {
    line(`${ev.level === "module" ? "Modules" : "Files"} in the cycle: ${ev.members.length}. ` +
      `${ev.exact ? "The break is the smallest." : "The break is a heuristic, not proven smallest."}`);
    panel.append(el("h3", {}, `Break: remove ${count(ev.break.length, "import", "imports")}`));
    const ul = el("ul", { class: "edges" });
    for (const l of ev.break.slice(0, 200)) {
      const a = fileIndex.get(l.from), b = fileIndex.get(l.to), li = el("li");
      if (a !== undefined) li.append(fileBtn(a)); else li.append(document.createTextNode(l.from));
      li.append(el("span", { class: "muted" }, " → "));
      if (b !== undefined) li.append(fileBtn(b)); else li.append(document.createTextNode(l.to));
      ul.append(li);
    }
    if (ev.break.length > 200) ul.append(el("li", { class: "muted" }, `and ${ev.break.length - 200} more`));
    panel.append(ul);
  } else if (f.kind === "misplaced-file") {
    line(`Imported by ${count(ev.imports_from_target, "file", "files")} of ${ev.target_module}, ` +
      `${count(ev.own_module_edges, "edge", "edges")} within its own module` + (ev.via_barrel ? ", through a barrel." : "."));
  } else if (f.kind === "sink-split") {
    line(`Imported by ${count(ev.ca, "module", "modules")}; its files serve ${count(ev.components.length, "separate group", "separate groups")}.`);
    ev.components.forEach((c, n) => {
      panel.append(el("h3", {}, `Group ${n + 1}: ${count(c.files.length, "file", "files")}, used by ${c.consumers.join(", ")}`));
      const ids = c.files.map(p => fileIndex.get(p)).filter(x => x !== undefined);
      const ul = el("ul", { class: "edges" });
      for (const x of ids.slice(0, 40)) { const li = el("li"); li.append(fileBtn(x)); ul.append(li); }
      panel.append(ul);
    });
  } else if (f.kind === "hidden-coupling") {
    line(`Changed together in ${count(ev.commits, "commit", "commits")}, with no import between them (${ev.modules.join(" and ")}).`);
  } else if (f.kind === "internals-reach") {
    line(`Imports past the public entry of ${ev.module}.`);
    if (ev.entries.length) line(`Entries: ${ev.entries.map(short).join(", ")}`);
  } else if (f.kind === "unstable-dependency") {
    line(`${ev.from} (instability ${ev.from_instability}) imports ${ev.to} (instability ${ev.to_instability}) ${count(ev.imports, "time", "times")}.`);
  } else if (f.kind === "seam") {
    line(`Modularity of the clusters ${ev.modularity}, of the folders ${ev.folder_modularity}.`);
    ev.clusters.forEach((c, n) => line(`Cluster ${n + 1}: ${count(c.files.length, "file", "files")} across ${c.modules.join(", ")}`));
    if (ev.hubs.length) line(`Hubs left out: ${ev.hubs.map(short).join(", ")}`);
  } else if (f.kind === "small-repo") {
    line(`${count(ev.files, "file", "files")}, ${count(ev.modules, "module", "modules")}.`);
  }
  if (fd.moves.length) {
    panel.append(el("h3", {}, fd.moves.length === 1 ? "Suggested move" : `Suggested moves: ${fd.moves.length}`));
    for (const mv of fd.moves) {
      const n = el("div", { class: "note mono" });
      n.append(document.createTextNode(short(files[mv.file].path)), el("br"), document.createTextNode("→ " + short(mv.to)));
      panel.append(n);
    }
  }
  if (f.simulation) {
    panel.append(el("h3", {}, "After the move"));
    panel.append(simTable(f.simulation.after));
  }
  const ms = [...fd.ms];
  if (ms.length) {
    panel.append(el("h3", {}, count(ms.length, "module", "modules")));
    const p = el("div", { class: "actions" });
    for (const m of ms.slice(0, 60)) p.append(modBtn(m));
    panel.append(p);
  }
  const fs = [...fd.fs];
  if (fs.length && f.kind !== "sink-split") {
    panel.append(el("h3", {}, count(fs.length, "file", "files")));
    const ul = el("ul", { class: "edges" });
    for (const x of fs.slice(0, 60)) { const li = el("li"); li.append(fileBtn(x)); ul.append(li); }
    if (fs.length > 60) ul.append(el("li", { class: "muted" }, `and ${fs.length - 60} more`));
    panel.append(ul);
  }
}
function showPanel() {
  panel.replaceChildren();
  panel.scrollTop = 0;
  const t = sel;
  if (!t) overview();
  else if (t.type === "module") modulePanel(t.i);
  else if (t.type === "file") filePanel(t.i);
  else if (t.type === "medge") medgePanel(t.i);
  else if (t.type === "fedge") fedgePanel(t.i);
  else findingPanel(t.i);
  /* Screen readers hear the new heading, not the whole panel. */
  const h2 = panel.querySelector("h2");
  $("announce").textContent = h2 ? h2.textContent : "";
}

/* ---------- start ---------- */
readTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); redraw(); });
new ResizeObserver(resize).observe(stage);
resize();
if (matchMedia("(max-width: 720px)").matches) $("legend-box").open = false;
showPanel();
</script>
</body>
</html>
